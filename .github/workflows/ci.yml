name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.26.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Verify module tidiness
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: make lint

      - name: Race tests
        run: go test -race ./...

      - name: Dependency hygiene
        shell: bash
        run: |
          set -euo pipefail

          if rg -n 'github.com/mattsp1290/local-symphony/internal/dispatcher|dispatcher\.ToolOutcome' --glob '*.go' .; then
            echo "forbidden dispatcher reference in Go source" >&2
            exit 1
          fi

          if rg -n '"(github.com/cloudwego/eino-ext[^"]*|go\.opentelemetry\.io/[^"]*|log|log/slog|[^"]*/auth[^"]*)"' --glob '*.go' .; then
            echo "forbidden telemetry/log/auth import in Go source" >&2
            exit 1
          fi

          for pkg in ./result ./fileops ./tracker; do
            imports="$(go list -f '{{join .Imports "\n"}}' "$pkg")"
            if grep -E '^os/exec$' <<<"$imports"; then
              echo "forbidden os/exec import in $pkg" >&2
              exit 1
            fi
          done

          for pkg in ./result ./fileops ./search ./shell ./tracker ./trackerwrite; do
            deps="$(go list -f '{{if not .Standard}}{{.ImportPath}}{{end}}' -deps "$pkg")"
            if grep -E 'local-symphony|internal/dispatcher|eino-ext|otel|slog|^log$|beads-go' <<<"$deps"; then
              echo "forbidden dependency in $pkg" >&2
              exit 1
            fi
          done

          if rg -n '"github\.com/mattsp1290/eino-agent(/[^" ]*)?"' catalog --glob '*.go'; then
            echo "forbidden eino-agent import in catalog source" >&2
            exit 1
          fi

          catalog_deps="$(go list -f '{{if not .Standard}}{{.ImportPath}}{{end}}' -deps ./catalog)"
          if grep -E '^github\.com/mattsp1290/eino-agent(/|$)' <<<"$catalog_deps"; then
            echo "forbidden eino-agent dependency in ./catalog" >&2
            exit 1
          fi

          tracker_beads_deps="$(go list -f '{{if not .Standard}}{{.ImportPath}}{{end}}' -deps ./tracker/beads)"
          if ! grep -q '^github.com/mattsp1290/beads-go/beads$' <<<"$tracker_beads_deps"; then
            echo "tracker/beads does not import beads-go SDK" >&2
            exit 1
          fi
          if grep -E 'local-symphony|internal/dispatcher|eino-ext|otel|slog|^log$' <<<"$tracker_beads_deps"; then
            echo "forbidden dependency in ./tracker/beads" >&2
            exit 1
          fi

  catalog-windows:
    name: Catalog contract (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.x
          cache: true

      - name: Test portable catalog contract
        run: go test ./catalog

  tracker-beads-integration:
    name: Tracker Beads Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.x
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install bd
        run: env -u CI npm install -g @beads/bd@1.0.4

      - name: Verify bd
        run: bd --version

      - name: Integration tests
        run: go test -tags=integration ./tracker/beads/...

  shell-startup:
    name: Shell startup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.x
          cache-dependency-path: |
            go.sum
            integration/shellstartup/go.sum
      - name: Install ripgrep
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          elif ! command -v rg >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
          fi
          command -v rg
      - name: Record platform and shell provenance
        shell: bash
        run: |
          uname -srm
          go version
          rg --version
          ls -l /bin/sh
          if [[ "$RUNNER_OS" == Linux ]]; then dpkg-query -W dash bash; else /bin/bash --version; fi
      - name: Leaf and catalog race tests
        run: go test -race -v -count=1 ./shell ./catalog
      - name: Mounted adapter acceptance
        working-directory: integration/shellstartup
        env:
          GOWORK: 'off'
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race -v -count=1 -timeout=120s ./...

  shell-login-regression:
    name: Shell login (isolated container)
    runs-on: ubuntu-latest
    # Official golang:1.26.3-bookworm manifest digest resolved 2026-09-08.
    container:
      image: golang:1.26.3-bookworm@sha256:386d475a660466863d9f8c766fec64d7fdad3edac2c6a05020c09534d71edb4b
    env:
      GOTOOLCHAIN: auto
      GOWORK: 'off'
      EINO_TOOLS_TEST_LOGIN: '1'
    steps:
      - name: Isolate login profiles inside disposable container
        run: |
          test -f /.dockerenv
          printf '# inert test container profile\n' > /etc/profile
          if test -f /etc/bash.bashrc; then printf '# inert\n' > /etc/bash.bashrc; fi
          rm -rf /etc/profile.d
          mkdir -p /etc/profile.d
          apt-get update && apt-get install -y ripgrep
      - uses: actions/checkout@v4
      - name: Record platform and shell provenance
        run: |
          uname -srm
          go version
          rg --version
          ls -l /bin/sh
          dpkg-query -W dash bash
      - name: Leaf and catalog login regressions
        shell: bash
        run: |
          set -euo pipefail
          env -u BASH_ENV -u ENV go test -race -v -count=1 ./shell ./catalog | tee /tmp/leaf-tests.log
          grep -F -- '--- PASS: TestStartupContract/login/' /tmp/leaf-tests.log
          grep -F -- '--- PASS: TestStartupContract/profile-and-capture/login-profile-control' /tmp/leaf-tests.log
      - name: Mounted login regressions
        working-directory: integration/shellstartup
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy -diff
          go vet ./...
          env -u BASH_ENV -u ENV go test -race -v -count=1 -timeout=120s ./... | tee /tmp/mounted-tests.log
          grep -F -- '--- PASS: TestMountedStartupContract/login/' /tmp/mounted-tests.log
          grep -F -- '--- PASS: TestMountedStartupContract/profile-and-capture/login-profile-control' /tmp/mounted-tests.log
